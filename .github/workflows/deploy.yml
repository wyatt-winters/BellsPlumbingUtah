name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-bellsplumbing
  cancel-in-progress: true

jobs:
  deploy:
    name: SFTP deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via rsync over SFTP/SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          sshpass -e rsync -avz \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '*.zip' \
            --exclude 'blog/schedule.json' \
            --exclude 'blog/bot-state.json' \
            --exclude 'blog/bot.log' \
            --exclude 'blog/publish.log' \
            --exclude '.DS_Store' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./ "${FTP_USERNAME}@agentadvisers.com:/home1/agentors/public_html/website_302faf96/"

      - name: Wake blog bot after deploy
        run: |
          curl -sf "https://bellsplumbingutah.com/blog/bot.php?key=${{ secrets.BLOG_BOT_KEY }}" || echo "Bot wake skipped (may need first manual run)"
