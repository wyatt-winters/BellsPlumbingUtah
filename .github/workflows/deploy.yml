name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-bellsplumbing
  cancel-in-progress: true

jobs:
  deploy:
    name: SFTP deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP (SSH)
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_EXCLUDE: ".git*, .github, scripts, *.zip, blog/schedule.json, blog/bot-state.json, blog/bot.log, blog/publish.log, README.txt, blog/README.md"
          REMOTE_HOST: agentadvisers.com
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PORT: 22
          SOURCE: ./
          TARGET: /home1/agentors/public_html/website_302faf96/

      - name: Wake blog bot after deploy
        run: |
          curl -sf "https://bellsplumbingutah.com/blog/bot.php?key=${{ secrets.BLOG_BOT_KEY }}" || echo "Bot wake skipped (may need first manual run)"
